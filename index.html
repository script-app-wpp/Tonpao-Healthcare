<!DOCTYPE html>
<html lang="th">
   <head>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
      <meta http-equiv="Pragma" content="no-cache">
      <meta http-equiv="Expires" content="0">
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <base target="_top">
      <style>
         body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f1f5f9;
         }
         iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
         }
      </style>
      <!-- ⭐️ โหลด LIFF SDK ไว้ที่หน้าหลัก (GitHub) ⭐️ -->
      <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
   </head>
   <body>
      <iframe id="gas-iframe" src="" allowfullscreen></iframe>

      <script>
         // ลิงก์ระบบจองคิว (GAS) ของคุณ
         const gasUrl = "https://script.google.com/macros/s/AKfycbwl6UCxjoa_dzyhSBZ8EA7vhLK-5YEO2UZTjudw20RUFcMraBx93PGb8MLgWbRd8FmH/exec";

         async function initializeLiff() {
            // สร้างตัวเลขเวลาปัจจุบัน (Cache Buster) เพื่อบังคับให้โหลดข้อมูลใหม่เสมอ
            const timestamp = new Date().getTime(); 

            try {
               await liff.init({ liffId: "2011283749-Pr7bzXG2" });
               
               if (liff.isLoggedIn()) {
                  // ถ้าล็อกอินแล้ว ดึง Profile แล้วส่งต่อเข้า iframe (เพิ่มตัวแปร &t=เวลาปัจจุบัน)
                  const profile = await liff.getProfile();
                  document.getElementById('gas-iframe').src = gasUrl + "?userId=" + profile.userId + "&t=" + timestamp;
               } else {
                  // ถ้ายังไม่ล็อกอิน ให้เด้งไปล็อกอิน LINE
                  liff.login();
               }
            } catch (err) {
               console.error("LIFF Initialization failed", err);
               // กรณี Error (เช่นเปิดในคอม) ก็ให้โชว์หน้าเว็บปกติไปก่อน (เพิ่มตัวแปร ?t=เวลาปัจจุบัน)
               document.getElementById('gas-iframe').src = gasUrl + "?t=" + timestamp;
            }
         }

         initializeLiff();
      </script>
   </body>
</html>
