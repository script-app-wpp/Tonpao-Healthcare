<!DOCTYPE html>
<html lang="th">
   <head>
      <!-- บรรทัดนี้สำคัญมาก: เพิ่ม maximum-scale=1.0 และ user-scalable=no เพื่อล็อกไม่ให้มือถือซูมจอเอง -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
      <base target="_top">
      <style>
         /* รีเซ็ตขอบหน้าจอ และล็อกไม่ให้หน้าเว็บหลัก (GitHub) เลื่อนหรือขยับได้ */
         body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f1f5f9;
         }
         /* ตั้งค่า iframe ให้เต็มจอพอดี */
         iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
         }
      </style>
   </head>
   <body>
      <!-- ลิงก์ระบบจองคิวของคุณ -->
      <iframe src="https://script.google.com/macros/s/AKfycbxTtyPh9mV5Ure50q_XgtLPm_G2qVf_YvWqVBDOw8NCsf7lO71cmxKNqtv_kSyCBvGV/exec" allowfullscreen></iframe>
   </body>
</html>
